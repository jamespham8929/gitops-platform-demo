# Production overlay, layered on top of values.yaml by the ArgoCD production Application.
# The image tag is bumped only through a promotion PR, never automatically.

image:
  # Updated by .github/workflows/promote.yml, which opens a PR for review.
  tag: "9f8e7d6"

replicaCount: 3

# Production spends longer at each weight and stops at 50% for a human. The
# analysis can abort the rollout on its own at any point before that; the manual
# gate only decides whether to finish it.
rollout:
  progressDeadlineSeconds: 3600
  abortScaleDownDelaySeconds: 900
  steps:
    - setWeight: 5
    - pause: {duration: 5m}
    - setWeight: 20
    - pause: {duration: 10m}
    - setWeight: 50
    - pause: {}
  analysis:
    count: 25
    interval: 1m
    window: 2m
    failureLimit: 1
    successRateThreshold: 0.99
    latencyP95Seconds: 0.4

ingress:
  hosts:
    - host: sample-service.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sample-service-tls
      hosts:
        - sample-service.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi
