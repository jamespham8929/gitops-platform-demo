name: Promote to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote to production"
        required: true
        type: string

jobs:
  promote:
    name: Promote ${{ github.event.inputs.image_tag }} to production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Update production values file
        env:
          # Read the input from the environment, not by pasting it into the
          # script, so a crafted tag cannot run shell commands.
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "::error::'$IMAGE_TAG' is not a valid image tag"
            exit 1
          fi
          sed -i -E "s/^([[:space:]]+)tag:.*/\1tag: \"${IMAGE_TAG}\"/" \
            charts/sample-service/values-production.yaml

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: promote/${{ github.event.inputs.image_tag }}
          title: "chore: promote ${{ github.event.inputs.image_tag }} to production"
          body: |
            Promotes image tag `${{ github.event.inputs.image_tag }}` to production.

            **Staging verification:** Check ArgoCD staging sync status before merging.

            **To deploy:** Merge this PR. ArgoCD will detect the values change and sync production.
          labels: promotion
          delete-branch: true
