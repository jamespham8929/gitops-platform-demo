name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/sample-service/**"
      - "charts/sample-service/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/sample-service/**"
      - "charts/sample-service/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

# Jobs get read-only access unless they ask for more below.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sample-service
  # Keep in step with the builder image in apps/sample-service/Dockerfile.
  GO_VERSION: "1.26"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sample-service/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/sample-service/src/go.sum
      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out
      - name: Enforce coverage threshold
        env:
          THRESHOLD: "80"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${total}% (threshold ${THRESHOLD}%)"
          if awk -v t="$total" -v min="$THRESHOLD" 'BEGIN { exit (t < min) ? 1 : 0 }'; then
            echo "Coverage check passed"
          else
            echo "Coverage ${total}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: apps/sample-service/src/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/sample-service/src/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a new linter release cannot turn main red on its own.
          version: v2.15.0
          working-directory: apps/sample-service/src

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      # The chart renders Argo Rollouts and prometheus-operator CRs, so schema
      # validation needs their schemas as well as the built-in Kubernetes ones.
      CRD_SCHEMAS: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.14.4
      - name: Lint chart
        run: helm lint charts/sample-service
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/
      - name: Validate environment overlays against Kubernetes and CRD schemas
        run: |
          for env in staging production; do
            echo "Validating $env overlay"
            helm template sample-service charts/sample-service \
              -f charts/sample-service/values.yaml \
              -f charts/sample-service/values-$env.yaml \
              | kubeconform -strict -summary \
                  -kubernetes-version 1.29.0 \
                  -schema-location default \
                  -schema-location "$CRD_SCHEMAS"
          done
      - name: Validate the Deployment fallback path
        run: |
          helm template sample-service charts/sample-service \
            --set rollout.enabled=false --set serviceMonitor.enabled=false \
            | kubeconform -strict -summary \
                -kubernetes-version 1.29.0 -schema-location default
      - name: Check the canary analysis reads a metric the service exports
        run: |
          # A rollout gated on a metric name the service never emits would sit at
          # "no data" and pass every step, so tie the two together in CI.
          queries=$(helm template sample-service charts/sample-service \
            -f charts/sample-service/values.yaml \
            -f charts/sample-service/values-production.yaml)
          for metric in http_requests_total http_request_duration_seconds_bucket; do
            grep -q "$metric" <<< "$queries" \
              || { echo "analysis template does not query $metric"; exit 1; }
            grep -rq "${metric%_bucket}" apps/sample-service/src/metrics.go \
              || { echo "service does not export $metric"; exit 1; }
          done
          echo "Analysis queries and exported metrics agree"

  smoke:
    name: Smoke test the built binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/sample-service/src/go.sum
      - name: Build and run the service
        run: |
          go build -C apps/sample-service/src -o "$RUNNER_TEMP/sample-service" .
          APP_VERSION=ci PORT=8080 "$RUNNER_TEMP/sample-service" &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
      - name: Run the smoke suite the promotion gate uses
        run: scripts/smoke.sh http://127.0.0.1:8080 ci
      - name: Confirm the suite fails on a bad build
        run: |
          # The smoke gate is only worth having if it actually rejects something.
          FAILURE_RATE=1 APP_VERSION=ci PORT=8081 "$RUNNER_TEMP/sample-service" &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/health > /dev/null && break
            sleep 1
          done
          if scripts/smoke.sh http://127.0.0.1:8081 ci; then
            echo "smoke suite passed a build that fails every order request"
            exit 1
          fi
          echo "Smoke suite correctly rejected the faulty build"

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [test, lint, smoke]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Staging must point at the commit tag, which never moves. metadata-action's
      # version output prefers the branch tag, and "main" would leave the values
      # file unchanged on every build, so ArgoCD would never roll anything out.
      - name: Pick the immutable tag
        id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The default docker driver cannot export a build cache, so cache-to
      # type=gha fails without a buildx builder of its own.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/sample-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy
        # Pinned to the v0.36.0 commit. A moving ref like @master runs whatever
        # the upstream branch holds on the day, with this job's token.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  update-staging-values:
    name: Update staging image tag
    runs-on: ubuntu-latest
    needs: [build-and-push, scan, sign-image]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update image tag in staging values
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          sed -i -E "s/^([[:space:]]+)tag:.*/\1tag: \"${IMAGE_TAG}\"/" \
            charts/sample-service/values-staging.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/sample-service/values-staging.yaml
          if git diff --cached --quiet; then
            echo "staging already runs ${IMAGE_TAG}"
            exit 0
          fi
          git commit -m "chore: update staging image tag to ${IMAGE_TAG}"
          git push

  sign-image:
    name: Sign image with cosign
    runs-on: ubuntu-latest
    needs: [build-and-push, scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
        run: |
          # Signing the digest, not the tag, ties the signature to the exact
          # bytes that were scanned. A tag can be moved after the fact.
          cosign sign --yes "$IMAGE"
