apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-service-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jamespham8929/gitops-platform-demo
    targetRevision: HEAD
    path: charts/sample-service
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  # No automated block at all: production neither auto-syncs nor self-heals.
  # Drift shows up as OutOfSync for a human to judge instead of being reverted
  # under them mid-incident. See docs/drift-detection.md.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
